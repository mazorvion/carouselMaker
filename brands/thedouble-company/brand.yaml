# The Double (company): the Double design system (DoubleDesignSystem.html) on the "calm" layout.
# Bold objects, calm ground: linen ground, Funnel Display 700 headlines with ONE Newsreader italic phrase
# (cobalt on light, lime on cobalt), Geist body, Geist Mono labels, Silkscreen status chips.
# Colour = capability (knowledge grape · personality bubblegum · voice sky · channels cobalt · actions tangerine).
# Inner slides may wear a pigment wash (`cap:` per slide or `rhythm: capabilities`); covers/CTA cobalt; `bg: deep` = Night.
name: The Double
handle: "@thedouble.ai"
logo: assets/brand/logos/lockup-ink.svg
emphasis: serif              # *word* → Newsreader italic in cobalt (engine/double.css)
design: calm                 # engine/skins/calm.css
skin: brands/thedouble-company/skin.css
# Shared design-system tokens, generated from cardtree-bulkbeings/shared-design-system.
# Regenerate with `npm run sync:tokens`; values below may reference its --ds-* variables.
shared: brands/_shared/thedouble/design-tokens.css
fonts:
  - https://fonts.googleapis.com/css2?family=Funnel+Display:wght@500;600;700&family=Newsreader:ital,opsz,wght@1,6..72,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Silkscreen&family=Caveat:wght@700&display=block

tokens:
  ground: "var(--ds-ground)"          # linen (shared)
  paper: "var(--ds-paper)"
  ink: "var(--ds-ink)"
  muted: "var(--ds-ink-2)"            # ink-2
  faint: "var(--ds-ink-3)"            # ink-3
  line: "var(--ds-line)"
  chip: "var(--ds-fill)"
  accent: "var(--ds-cobalt)"          # cobalt: the italic phrase, links, the brand
  accent-ink: "var(--ds-on-ink)"
  accent-deep: "var(--ds-cobalt-deep)"
  hi: "var(--ds-channels-soft)"       # #DEE2FF: soft chip / marker fill (follows the post's capability via theme:)
  hi-soft: "#EEF0FF"                  # Company-specific tint
  glow: "transparent"
  deep: "var(--ds-deep)"
  deep-ink: "var(--ds-on-ink)"
  tray: "var(--ds-cobalt)"
  live: "var(--ds-live)"              # lime = live, squares and chips only
  good: "var(--ds-cobalt)"
  bad: "var(--ds-err)"
  note: "var(--ds-cobalt)"
  font-display: "'Funnel Display', 'Inter Tight', Arial, sans-serif"
  font-human: "'Newsreader', Georgia, serif"
  font-body: "'Geist', 'Inter', system-ui, sans-serif"
  font-mono: "'Geist Mono', ui-monospace, monospace"
  font-pixel: "'Silkscreen', monospace"
  font-hand: "'Caveat', cursive"
  display-weight: "700"
  display-track: "-0.035em"
  r-card: "var(--ds-radius-28)"   # shared radius-28
  r-block: "var(--ds-radius-32)"  # shared radius-32
  r-tile: "var(--ds-radius-icon)" # shared radius-icon
  shadow: "0 1px 2px rgba(0,0,0,.04), 0 16px 40px -16px rgba(0,0,0,.16), 0 0 0 1px rgba(0,0,0,.04)"

palette:
  cobalt:    ["#2F43F2", "#E3E7FF", "#FFFFFF"]
  lime:      ["#D4F53C", "#EEF8C8", "#0E0F12"]
  tangerine: ["#FF7417", "#FFE8D8", "#0E0F12"]
  grape:     ["#6A2CF5", "#ECE4FF", "#FFFFFF"]
  bubblegum: ["#FF4FAE", "#FFE2F1", "#0E0F12"]
  sky:       ["#16B0FA", "#DCF1FC", "#0E0F12"]
  ink:       ["#0E0F12", "#ECECEE", "#FFFFFF"]
  # added with the new felt characters (assets/agents/green|yellow|red|ink|snow.png)
  green:     ["#16A34A", "#DCF5E4", "#FFFFFF"]
  yellow:    ["#FFC21A", "#FFF3CC", "#0E0F12"]
  red:       ["#E5372F", "#FFE1DE", "#FFFFFF"]
  snow:      ["#9AA0AC", "#EEF0F4", "#0E0F12"]
  # departments (the five capabilities), used by staff badges and meta chips
  knowledge:   ["#6A2CF5", "#E7DDFF", "#FFFFFF"]
  personality: ["#FF4FAE", "#FFDDEE", "#0E0F12"]
  voice:       ["#16B0FA", "#D5EEFB", "#0E0F12"]
  channels:    ["#2F43F2", "#DEE2FF", "#FFFFFF"]
  actions:     ["#FF7417", "#FFE4D1", "#0E0F12"]

# Colour presets (post: `theme: yellow`). Calm uses `highlight` for the marker underline.
accents:
  # theme: sets the post's capability colour for chips, markers and soft fills. Italic stays cobalt.
  channels:    { highlight: "#DEE2FF" }
  knowledge:   { highlight: "#E9E1FF" }
  personality: { highlight: "#FFDDEF" }
  voice:       { highlight: "#D5EEFB" }
  actions:     { highlight: "#FFE4D1" }
  # older names (kept so existing posts still render)
  lime:    { highlight: "#DEE2FF" }
  cobalt:  { highlight: "#DEE2FF" }
  yellow:  { highlight: "#FFE4D1" }
  orange:  { highlight: "#FFE4D1" }
  pink:    { highlight: "#FFDDEF" }
  sky:     { highlight: "#D5EEFB" }
  mint:    { highlight: "#D5EEFB" }

# Imagery: no humans. Felt agents (assets/agents) and felt scenes only.
rules:
  cover: avatar
  mascot: true
  people: false
